<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping list example</title>
    <style>
      li {
        margin-bottom: 10px;
      }

      li button {
        font-size: 12px;
        margin-left: 20px;
        color: #666;
      }
    </style>
  </head>
  <body>

    <h1>My shopping list</h1>

    <form>
      <label for="item">Enter a new item:</label>
      <input type="text" name="item" id="item">
      <button>Add item</button>
    </form>

    <ul>

    </ul>

    <script>
        const unorderList = document.querySelector("ul");
        const userInput = document.querySelector("input");
        const clickButton = document.querySelector("button");

    clickButton.addEventListener("click", function (event) {
        event.preventDefault();          
        const currentItem = userInput.value; //store value

        if (currentItem !== "") {
            console.log(`Button clicked! Adding: ${currentItem}`);
            
            userInput.value = ""; //clear input

            const listItem = document.createElement("li");
            const spannn = document.createElement("span");
            const deleteBtn = document.createElement("button"); // create new elements

            listItem.appendChild(spannn);
            listItem.appendChild(deleteBtn); //create hierarchy

            spannn.textContent = currentItem;
            deleteBtn.textContent = "Delete"; // set content

            unorderList.appendChild(listItem); // add finished item to list

            deleteBtn.addEventListener("click", function(){
                unorderList.removeChild(listItem);
            }); // add delete logic

            userInput.focus(); // focus back to input
        }
    });

    </script>
  </body>
</html>
